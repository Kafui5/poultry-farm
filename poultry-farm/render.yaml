services:
  - type: web
    name: poultry-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poultry-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /health

  - type: web
    name: poultry-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerBuildArgs:
      - key: VITE_API_URL
        fromService:
          name: poultry-backend
          type: web
          property: host
    envVars:
      - key: VITE_API_URL
        fromService:
          name: poultry-backend
          type: web
          property: host

databases:
  - name: poultry-db
    databaseName: poultry_farm
    user: poultry_user
